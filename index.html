<!DOCTYPE html>
<!-- Player interface based on the MIT-licensed source at starnew-strm.pages.dev/LICENSE -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="origin">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Live</title>
<link rel="preconnect" href="https://jiotv.com" crossorigin>
<link rel="preconnect" href="https://jio.com" crossorigin>
<link rel="preconnect" href="https://jio.com" crossorigin>
<link rel="stylesheet" href="https://cloudflare.com">
<style>
:root{--ks:78px;--ksc:#147cf5}
*,::before,::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;
font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;user-select:none}
#overlay{position:fixed;inset:0;background:#0a0a0a;z-index:9999;display:flex;align-items:center;justify-content:center;transition: opacity 0.3s ease;}
#overlay svg{width:var(--ks);height:var(--ks);animation:ks 1.15s linear infinite;display:block;overflow:visible}
@keyframes ks{100%{transform:rotate(360deg)}}
#ovmsg{position:absolute;bottom:18%;left:0;right:0;padding:0 26px;text-align:center;
color:#fca5a5;font-size:13px;line-height:1.5;font-weight:600}
#ovstage{position:absolute;bottom:13%;left:0;right:0;padding:0 26px;text-align:center;
color:#8b95a1;font-size:11px;line-height:1.5;letter-spacing:.4px}
#channel-list{position:fixed;inset:0;z-index:9998;display:block;overflow-y:auto;color:#f4f4f5;background-color:#111;
background-image:radial-gradient(circle at 50% 0,rgba(255,255,255,.04),transparent 42%),
linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
background-size:auto,32px 32px,32px 32px}
.shell{position:relative;width:min(100%,720px);min-height:100%;margin:0 auto;
padding:max(76px,env(safe-area-inset-top,0px)) clamp(24px,7.2vw,52px) max(42px,env(safe-area-inset-bottom,0px))}
.kicker{display:inline-block;padding:11px 14px;color:#aaaeb7;background:rgba(30,30,30,.94);
border:1px solid #373737;font-size:14px;font-weight:500;line-height:1}
#ch-title{margin-top:46px;color:#fafafa;font-size:clamp(36px,8.5vw,52px);font-weight:700;
letter-spacing:-.055em;line-height:1.03}
.copy{max-width:590px;margin-top:25px;color:#adb1b9;font-size:clamp(16px,3.9vw,20px);line-height:1.55}
#ch-count{display:inline-block;margin-top:20px;color:#bfc1c7;font-size:14px;font-weight:500}
.search{display:flex;align-items:center;gap:13px;width:100%;height:64px;margin:24px 0;padding:0 18px;
color:#a8abb3;background:#202020;border:1px solid #3a3a3a;transition:.16s}
.search:focus-within{color:#fff;background:#242424;border-color:#747474}
.search svg{width:20px;height:20px;flex:0 0 auto}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f6f6f6;font-size:17px}
.search input::placeholder{color:#92959e}
#ch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ch-card{position:relative;display:flex;min-height:126px;flex-direction:column;align-items:flex-start;
justify-content:center;gap:13px;padding:22px;background:#202020;border:1px solid #383838;
color:#f4f4f5;cursor:pointer;overflow:hidden;text-decoration:none;transition:.16s;-webkit-tap-highlight-color:transparent}
.ch-card::after{content:"→";position:absolute;right:20px;bottom:17px;color:#aeb1b9;font-size:24px;transition:.16s}
.ch-card:hover{background:#f3f3f1;border-color:#f3f3f1;color:#151515}
.ch-card:hover .ch-num,.ch-card:hover .ch-name,.ch-card:hover::after{color:#151515}
.ch-card:hover::after{transform:translateX(4px)}
.ch-num{color:#aeb1b9;font-size:12px;font-weight:500;line-height:1}
.ch-num::before{content:"CHANNEL ";font-size:11px}
.ch-name{max-width:calc(100% - 30px);overflow:hidden;color:#f4f4f5;font-size:20px;font-weight:600;
line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
.notice{margin-top:54px;padding:28px 24px;background:rgba(32,32,32,.96);border:1px solid #3a3a3a;color:#d7d8dc}
.notice p{color:#afb1b8;font-size:15px;line-height:1.6}
.notice a{color:#f2f2ef;text-underline-offset:3px}
#pc{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;touch-action:manipulation}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}
#status{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom,0px));left:12px;z-index:10001;
display:flex;align-items:center;gap:7px;padding:0 14px 0 10px;height:26px;min-width:156px;max-width:272px;
overflow:hidden;white-space:nowrap;background:linear-gradient(160deg,rgba(9,9,11,.94),rgba(15,15,18,.9));
border:1px solid rgba(255,255,255,.13);border-radius:4px;box-shadow:0 2px 16px rgba(0,0,0,.65);
backdrop-filter:blur(16px);font-size:9px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
pointer-events:none;opacity:0;transform:translateY(6px);transition:.22s}
#status.show{opacity:1;transform:translateY(0)}
.st-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
#status.ok{color:#9ca0a8}#status.ok .st-dot{background:#60a5fa}
#status.live{color:#c4c8ce}#status.live .st-dot{background:#22d3a0;animation:dp 2s ease-in-out infinite}
#status.warn{color:#f2c94c}#status.warn .st-dot{background:#fb923c;animation:dp 1s ease-in-out infinite}
#status.err{color:#fca5a5}#status.err .st-dot{background:#f87171}
@keyframes dp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.28;transform:scale(.52)}}
.sp-btn{opacity:.75;display:flex;align-items:center;justify-content:center;height:100%;min-width:36px;
transition:.15s;background:transparent!important;border:0!important;cursor:pointer!important;
padding:0 8px!important;color:#fff!important}
.sp-btn:hover,.sp-btn.active{opacity:1}
.sp-btn.active{color:#38bdf8!important}
.fit-pill{font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 7px;border-radius:4px;line-height:1;
border:1.5px solid rgba(255,255,255,.28);color:rgba(255,255,255,.8);pointer-events:none;white-space:nowrap}
.sp-fit-btn.mode-fill .fit-pill{border-color:#38bdf8;color:#38bdf8}
.sp-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa}
.shaka-controls-container button{color:#fff!important}
.shaka-video-container{background-color:#000!important}
#dbg{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:9996;display:none;
max-width:300px;padding:8px 10px;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.16);
color:#9fe8b8;font:10px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;
pointer-events:none;border-radius:3px}
@media(max-width:520px){.shell{padding-top:max(62px,env(safe-area-inset-top,0px));padding-left:24px;padding-right:24px}
#ch-title{margin-top:38px}#ch-grid{grid-template-columns:1fr;gap:12px}}
</style>
</head>
<body>

<div id="overlay">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://w3.org" aria-label="Loading">
    <defs><linearGradient id="lg" x1="18" y1="78" x2="82" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d21cff" stop-opacity=".25"/><stop offset=".18" stop-color="#b624ff" stop-opacity=".68"/>
      <stop offset=".43" stop-color="#7045ff"/><stop offset=".72" stop-color="#287bff"/><stop offset="1" stop-color="#087cff"/>
    </linearGradient></defs>
    <circle cx="50" cy="50" r="34" stroke="url(#lg)" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="178 36" transform="rotate(-40 50 50)"/>
  </svg>
  <p id="ovmsg"></p>
  <p id="ovstage"></p>
</div>

<div id="status" class="show ok"><span class="st-dot"></span><span>Ready</span></div>
<div id="dbg"></div>

<div id="channel-list" aria-label="Channel selection">
  <main class="shell">
    <header>
      <p class="kicker">Live Channel Directory</p>
      <h1 id="ch-title">Select a Channel</h1>
      <p class="copy">Choose a live stream to begin watching.</p>
      <span id="ch-count">0 Channels Available</span>
    </header>

    <div class="search">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://w3.org">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <input type="text" id="search-input" placeholder="Search channels by name...">
    </div>

    <!-- Active injection channel target grid -->
    <div id="ch-grid"></div>

    <div class="notice">
      <p>This page is a client-side interface. It does not store or host files on the server delivering the interface.</p>
    </div>
  </main>
</div>

<div id="pc">
  <div data-shaka-player-container class="shaka-video-container">
    <video data-shaka-player id="video" autoplay playsinline></video>
  </div>
</div>

<script src="https://cloudflare.com"></script>
<script>
  // Global reference to handle stream injection safely
  let shakaPlayerInstance = null;

  // IMMEDIATELY dismiss the splash overlay to prevent freezing the interface
  function dismissLoader() {
    const overlay = document.getElementById('overlay');
    if (overlay) overlay.style.opacity = '0';
    setTimeout(() => { if(overlay) overlay.style.display = 'none'; }, 300);
  }

  // Safe wrapper for Shaka Initialization
  async function initPlayer() {
    try {
      if (typeof shaka === 'undefined') {
        console.warn('Shaka core CDN library hasn\'t loaded completely.');
        return;
      }

      // Fix polyfill reference name constraints
      if (shaka.polyfill && shaka.polyfill.installAll) {
        shaka.polyfill.installAll();
      }

  if (!shaka.Player.isBrowserSupported()) {
console.warn('MSE extensions are restricted on this device profile.');
return;
}
const video = document.getElementById('video');
const playerContainer = video.parentElement;
const player = new shaka.Player();
await player.attach(video);
shakaPlayerInstance = player;
// Safe UI wrapper bind
const ui = new shaka.ui.Overlay(player, playerContainer, video);
player.configure({
streaming: {
bufferingGoal: 3,
rebufferingGoal: 1,
bufferBehind: 2,
lowLatencyMode: true,
safeSeekOffset: 1
}
});
console.log('Shaka player context ready.');
} catch (err) {
console.error('Player initialization failure handled safely:', err);
} finally {
// Always unlock screen no matter what happens inside initialization
dismissLoader();
}
}
document.addEventListener('DOMContentLoaded', () => {
// Fire initialization engine safely
initPlayer();
// Safety backup to remove loading ring if engine times out
setTimeout(dismissLoader, 1500);
});
