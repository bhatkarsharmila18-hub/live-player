<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="origin">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Live</title>
<link rel="preconnect" href="https://www.jiotv.com/" crossorigin>
<link rel="preconnect" href="https://jiotvpllive.cdn.jio.com/" crossorigin>
<link rel="preconnect" href="https://jiotvmblive.cdn.jio.com/" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.0/controls.min.css">
<style>
:root{--ks:78px;--ksc:#147cf5}
*,::before,::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;
font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;user-select:none}
#overlay{position:fixed;inset:0;background:#0a0a0a;z-index:9999;display:flex;align-items:center;justify-content:center}
#overlay svg{width:var(--ks);height:var(--ks);animation:ks 1.15s linear infinite;display:block;overflow:visible}
@keyframes ks{100%{transform:rotate(360deg)}}
#channel-list{position:fixed;inset:0;z-index:9998;display:none;overflow-y:auto;color:#f4f4f5;background-color:#111;
background-image:radial-gradient(circle at 50% 0,rgba(255,255,255,.04),transparent 42%),
linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
background-size:auto,32px 32px,32px 32px}
.shell{position:relative;width:min(100%,720px);min-height:100%;margin:0 auto;
padding:max(76px,env(safe-area-inset-top,0px)) clamp(24px,7.2vw,52px) max(42px,env(safe-area-inset-bottom,0px))}
.kicker{display:inline-block;padding:11px 14px;color:#aaaeb7;background:rgba(30,30,30,.94);
border:1px solid #373737;font-size:14px;font-weight:500;line-height:1}
#ch-title{margin-top:46px;color:#fafafa;font-size:clamp(36px,8.5vw,52px);font-weight:700;
letter-spacing:-.055em;line-height:1.03}
.copy{max-width:590px;margin-top:25px;color:#adb1b9;font-size:clamp(16px,3.9vw,20px);line-height:1.55}
#ch-count{display:inline-block;margin-top:20px;color:#bfc1c7;font-size:14px;font-weight:500}
.search{display:flex;align-items:center;gap:13px;width:100%;height:64px;margin:24px 0;padding:0 18px;
color:#a8abb3;background:#202020;border:1px solid #3a3a3a;transition:.16s}
.search:focus-within{color:#fff;background:#242424;border-color:#747474}
.search svg{width:20px;height:20px;flex:0 0 auto}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f6f6f6;font-size:17px}
.search input::placeholder{color:#92959e}
#ch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ch-card{position:relative;display:flex;min-height:126px;flex-direction:column;align-items:flex-start;
justify-content:center;gap:13px;padding:22px;background:#202020;border:1px solid #383838;
color:#f4f4f5;cursor:pointer;overflow:hidden;text-decoration:none;transition:.16s;-webkit-tap-highlight-color:transparent}
.ch-card::after{content:"→";position:absolute;right:20px;bottom:17px;color:#aeb1b9;font-size:24px;transition:.16s}
.ch-card:hover{background:#f3f3f1;border-color:#f3f3f1;color:#151515}
.ch-card:hover .ch-num,.ch-card:hover .ch-name,.ch-card:hover::after{color:#151515}
.ch-card:hover::after{transform:translateX(4px)}
.ch-num{color:#aeb1b9;font-size:12px;font-weight:500;line-height:1}
.ch-num::before{content:"CHANNEL ";font-size:11px}
.ch-name{max-width:calc(100% - 30px);overflow:hidden;color:#f4f4f5;font-size:20px;font-weight:600;
line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
.notice{margin-top:54px;padding:28px 24px;background:rgba(32,32,32,.96);border:1px solid #3a3a3a;color:#d7d8dc}
.notice p{color:#afb1b8;font-size:15px;line-height:1.6}
.notice a{color:#f2f2ef;text-underline-offset:3px}
#pc{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;touch-action:manipulation}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}
#status{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom,0px));left:12px;z-index:9997;
display:flex;align-items:center;gap:7px;padding:0 14px 0 10px;height:26px;min-width:156px;max-width:272px;
overflow:hidden;white-space:nowrap;background:linear-gradient(160deg,rgba(9,9,11,.94),rgba(15,15,18,.9));
border:1px solid rgba(255,255,255,.13);border-radius:4px;box-shadow:0 2px 16px rgba(0,0,0,.65);
backdrop-filter:blur(16px);font-size:9px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
pointer-events:none;opacity:0;transform:translateY(6px);transition:.22s}
#status.show{opacity:1;transform:translateY(0)}
.st-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
#status.ok{color:#9ca0a8}#status.ok .st-dot{background:#60a5fa}
#status.live{color:#c4c8ce}#status.live .st-dot{background:#22d3a0;animation:dp 2s ease-in-out infinite}
#status.warn{color:#f2c94c}#status.warn .st-dot{background:#fb923c;animation:dp 1s ease-in-out infinite}
#status.err{color:#fca5a5}#status.err .st-dot{background:#f87171}
@keyframes dp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.28;transform:scale(.52)}}
.sp-btn{opacity:.75;display:flex;align-items:center;justify-content:center;height:100%;min-width:36px;
transition:.15s;background:transparent!important;border:0!important;cursor:pointer!important;
padding:0 8px!important;color:#fff!important}
.sp-btn:hover,.sp-btn.active{opacity:1}
.sp-btn.active{color:#38bdf8!important}
.fit-pill{font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 7px;border-radius:4px;line-height:1;
border:1.5px solid rgba(255,255,255,.28);color:rgba(255,255,255,.8);pointer-events:none;white-space:nowrap}
.sp-fit-btn.mode-fill .fit-pill{border-color:#38bdf8;color:#38bdf8}
.sp-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa}
.shaka-controls-container button{color:#fff!important}
.shaka-video-container{background-color:#000!important}
#dbg{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:9996;display:none;
max-width:300px;padding:8px 10px;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.16);
color:#9fe8b8;font:10px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;
pointer-events:none;border-radius:3px}
@media(max-width:520px){.shell{padding-top:max(62px,env(safe-area-inset-top,0px));padding-left:24px;padding-right:24px}
#ch-title{margin-top:38px}#ch-grid{grid-template-columns:1fr;gap:12px}}
</style>
</head>
<body>

<div id="overlay">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Loading">
    <defs><linearGradient id="lg" x1="18" y1="78" x2="82" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d21cff" stop-opacity=".25"/><stop offset=".18" stop-color="#b624ff" stop-opacity=".68"/>
      <stop offset=".43" stop-color="#7045ff"/><stop offset=".72" stop-color="#287bff"/><stop offset="1" stop-color="#087cff"/>
    </linearGradient></defs>
    <circle cx="50" cy="50" r="34" stroke="url(#lg)" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="178 36" transform="rotate(-40 50 50)"/>
  </svg>
</div>

<div id="status" class="show warn"><span class="st-dot"></span><span>Loading Stream · Please Wait</span></div>
<div id="dbg"></div>

<div id="channel-list" aria-label="Channel selection">
  <main class="shell">
    <header>
      <p class="kicker">Live Channel Directory</p>
      <h1 id="ch-title">Select a channel</h1>
      <p class="copy">Choose a live stream to begin watching.</p>
      <span id="ch-count" aria-live="polite"></span>
    </header>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
      <input id="q" type="search" placeholder="Search channels" autocomplete="off" spellcheck="false">
    </label>
    <div id="ch-grid" role="list"></div>
    <footer class="notice">
      <p>Player interface derived from an MIT-licensed source. Streams are remote third-party relays.</p>
    </footer>
  </main>
</div>

<div id="pc" data-shaka-player-container shaka-controls="true" class="shaka-video-container">
  <video id="v" playsinline webkit-playsinline preload="auto" muted
    x5-video-player-type="h5" x5-video-player-fullscreen="true" class="shaka-video"></video>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.0/shaka-player.ui.min.js"></script>
<script>
(function(){
"use strict";

var API = "https://sonujson-v7.pages.dev/Data/sports.json";
var MAXTRIES = 8;

var $ov=document.getElementById("overlay"),$st=document.getElementById("status"),
    $list=document.getElementById("channel-list"),$grid=document.getElementById("ch-grid"),
    $pc=document.getElementById("pc"),$v=document.getElementById("v"),$dbg=document.getElementById("dbg"),_t=null;

function tier(){
  var m=navigator.deviceMemory||4,c=navigator.hardwareConcurrency||4,
      mob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent),
      cx=navigator.connection||navigator.mozConnection||navigator.webkitConnection,
      n=cx?(cx.effectiveType||"4g"):"4g";
  if(!mob) return "high";
  if(m<=1.5||c<=2||n==="slow-2g"||n==="2g") return "low";
  if(m<=3||c<=4) return "mid";
  return "high";
}
var PROF={low:{buf:20,reBuf:4,behind:25,maxH:480,bwEst:700000},
          mid:{buf:26,reBuf:5,behind:30,maxH:720,bwEst:1200000},
          high:{buf:30,reBuf:5,behind:30,maxH:1080,bwEst:2000000}}[tier()];
var FITS=["contain","fill","cover"],LBL={contain:"Fit",fill:"Fill",cover:"Zoom"};

function toast(msg,type,dur){
  $st.innerHTML='<span class="st-dot"></span><span></span>';
  $st.lastChild.textContent=msg;
  $st.className="show "+(type||"ok");
  if(_t)clearTimeout(_t);
  if(dur!==0)_t=setTimeout(function(){$st.className=$st.className.replace("show","").trim();},dur||4000);
}
function hideOv(){$ov.style.display="none"}
function chId(){return new URLSearchParams(location.search).get("id")||""}
function rawCookie(c){return c&&c.indexOf("__hdnea__=")===0?c.slice(10):(c||"")}
function withCookie(u,r){
  if(!u||!r||u.indexOf("__hdnea__")!==-1) return u;
  return u+(u.indexOf("?")!==-1?"&":"?")+"__hdnea__="+r;
}
function ne(v){return typeof v==="string"&&v.trim().length>0}

function buildKeys(ch){
  var out={};
  if(Array.isArray(ch.sonuxs)) ch.sonuxs.forEach(function(e){
    if(typeof e!=="string")return;var p=e.split(":");
    if(p.length<2||!ne(p[0])||!ne(p[1]))return;
    out[p[0].trim().toLowerCase()]=p[1].trim().toLowerCase();
  });
  if(Object.keys(out).length) return out;
  if(ne(ch.key_id)&&ne(ch.key)) out[ch.key_id.trim().toLowerCase()]=ch.key.trim().toLowerCase();
  return out;
}

function loadData(){
  return fetch(API,{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("Data HTTP "+r.status);
    return r.json();
  }).then(function(d){
    if(!d||!Array.isArray(d.channels)||!d.channels.length) throw new Error("Data empty");
    return d;
  });
}

function renderList(chans){
  hideOv();
  var $c=document.getElementById("ch-count"),$q=document.getElementById("q");
  function draw(items){
    var f=document.createDocumentFragment();
    $grid.replaceChildren();
    items.forEach(function(ch,i){
      var a=document.createElement("a"),n=document.createElement("span"),t=document.createElement("span");
      a.className="ch-card";a.href="?id="+encodeURIComponent(ch.id);a.setAttribute("role","listitem");
      n.className="ch-num";n.textContent=i+1;
      t.className="ch-name";t.textContent=ch.name||"Untitled channel";
      a.append(n,t);f.appendChild(a);
    });
    $grid.appendChild(f);
  }
  function filter(){
    var v=($q.value||"").trim().toLowerCase();
    var items=v?chans.filter(function(c){return String(c.name||"").toLowerCase().indexOf(v)!==-1}):chans;
    $c.textContent=items.length+(items.length===1?" channel":" channels");
    draw(items);
  }
  $q.addEventListener("input",filter);
  filter();
  $list.style.display="block";
}

function errMsg(m){
  $ov.style.display="flex";
  toast(m,"err",0);
}

function ratio(w,h){
  if(!w||!h) return "—";
  function g(a,b){return b?g(b,a%b):a}
  var d=g(w,h)||1,rw=w/d,rh=h/d,r=w/h,best=null,bd=.02,
      named={"16:9":16/9,"4:3":4/3,"21:9":21/9,"1:1":1,"9:16":9/16,"3:2":3/2,"5:4":5/4,"2:1":2};
  Object.keys(named).forEach(function(k){var x=Math.abs(named[k]-r);if(x<bd){bd=x;best=k}});
  if(best) return best;
  return (rw<=40&&rh<=40)?rw+":"+rh:r.toFixed(2)+":1";
}

function injectFit(container,vid){
  var panel=container.querySelector(".shaka-controls-button-panel");
  if(!panel) return false;
  var anchor=panel.querySelector(".shaka-fullscreen-button"),idx=0,
      btn=document.createElement("button");
  btn.className="sp-btn sp-fit-btn";
  btn.title="Video Fit: Fit";
  btn.setAttribute("aria-label","Cycle Video Fit Mode");
  btn.innerHTML='<span class="fit-pill">—</span>';
  anchor?panel.insertBefore(btn,anchor):panel.appendChild(btn);

  var cur="—";
  function apply(i){
    idx=i;var m=FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m==="fill")vid.classList.add("mode-fill");
    if(m==="cover")vid.classList.add("mode-cover");
    btn.classList.remove("mode-fill","mode-cover");
    if(m!=="contain")btn.classList.add("mode-"+m);
    btn.title="Video Fit: "+LBL[m];
    var p=btn.querySelector(".fit-pill");
    if(p)p.textContent=(m==="contain")?cur:LBL[m];
  }
  btn.addEventListener("click",function(e){e.stopPropagation();apply((idx+1)%FITS.length)});
  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev,function(){
      if(!(document.fullscreenElement||document.webkitFullscreenElement))apply(0);
    });
  });
  var tries=0;
  function upd(){
    var p=btn.querySelector(".fit-pill");if(!p)return;
    if(vid.videoWidth>0){cur=ratio(vid.videoWidth,vid.videoHeight);
      if(FITS[idx]==="contain")p.textContent=cur;tries=0;}
    else if(tries<15){tries++;setTimeout(upd,700)}
  }
  vid.addEventListener("loadedmetadata",function(){tries=0;upd()});
  vid.addEventListener("resize",upd);
  vid.addEventListener("timeupdate",function h(){vid.removeEventListener("timeupdate",h);upd()});
  upd();
  return true;
}

/* ------------------------------------------------------------------ */

async function startPlayer(){
  var id=chId();
  var debug=new URLSearchParams(location.search).has("debug");
  $pc.style.display="flex";
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){errMsg("Browser Not Supported.");return}

  var player=new shaka.Player();
  try{ await player.attach($v); }
  catch(e){ errMsg("Attach failed: "+(e&&e.message||e)); return; }

  new shaka.ui.Overlay(player,$pc,$v).configure({
    controlPanelElements:["play_pause","mute","volume","time_and_duration","spacer",
      "quality","picture_in_picture","fullscreen"],
    seekBarColors:{base:"#828282",buffered:"#ffc336",played:"#1fc7ff"}
  });

  var ic=0;(function inj(){if(injectFit($pc,$v))return;if(++ic<5)setTimeout(inj,150)})();

  var cookie="",raw="",url="",keys={};
  var attempts=0,gen=0,busy=false,started=false,lastCur=0,lastFail=0,
      stallTmr=null,prevDvr=false,lastErr="none";
  var isMob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  /* ---- config ---- */
  function cfg(){
    var r={};
    if(PROF.maxH<1080) r.maxHeight=PROF.maxH;
    return {
      drm:{clearKeys:keys},
      manifest:{defaultPresentationDelay:12,ignoreTextStreamFailures:true,
        retryParameters:{maxAttempts:4,baseDelay:300,backoffFactor:2,fuzzFactor:.5,timeout:20000}},
      streaming:{lowLatencyMode:false,bufferingGoal:PROF.buf,rebufferingGoal:PROF.reBuf,
        bufferBehind:PROF.behind,safeSeekOffset:4,stallEnabled:true,stallThreshold:5,stallSkip:.2,
        inaccurateManifestTolerance:0,
        retryParameters:{maxAttempts:4,baseDelay:300,backoffFactor:2,fuzzFactor:.5,timeout:20000}},
      abr:{enabled:true,defaultBandwidthEstimate:PROF.bwEst,switchInterval:5,restrictions:r}
    };
  }

  /* ---- network ---- */
  var T=shaka.net.NetworkingEngine.RequestType;
  player.getNetworkingEngine().registerRequestFilter(function(type,req){
    if(!cookie) return;
    req.headers["Cookie"]=cookie;
    if(type===T.MANIFEST||type===T.SEGMENT||type===T.LICENSE)
      req.uris=req.uris.map(function(u){return withCookie(u,raw)});
  });

  /* ---- helpers ---- */
  function clearStall(){ if(stallTmr){clearTimeout(stallTmr);stallTmr=null} }
  function seekRange(){
    try{var r=player.seekRange();
      if(r&&isFinite(r.start)&&isFinite(r.end)&&r.end>r.start)return r;}catch(_){}
    return null;
  }
  function isDvr(t){var r=seekRange();return !!r&&isFinite(t)&&t<r.end-7}
  function remember(){
    var t=$v.currentTime;
    prevDvr=isDvr(t);
    return prevDvr?t:null;
  }
  function clampTo(t){
    var r=seekRange(); if(!r||!isFinite(t)) return null;
    var lo=Math.min(r.end-.25,r.start+.25),hi=Math.max(lo,r.end-.75);
    return Math.min(Math.max(t,lo),hi);
  }

  function describe(e){
    if(!e) return "Unknown error";
    var d=e.detail||{},c=d.code||0,
        s=(d.data&&d.data[0]&&d.data[0].httpStatus)||0;
    if(s===403) return "403 · Token expired or geo-blocked";
    if(s===404||s===410) return s+" · Manifest/segment gone";
    if(s) return "HTTP "+s;
    if(c===1001) return "Network error";
    if(c===1002) return "HTTP error";
    if(c===1006) return "Manifest unavailable";
    if(c===3016) return "Segment stalled";
    if(c===6001||c===6003) return "DRM key rejected";
    return "Player error "+c;
  }

  /* ---- watchdog ---- */
  function kick(ms){
    clearStall();
    stallTmr=setTimeout(function(){
      stallTmr=null;
      if(!started||$v.paused||$v.ended||document.hidden)return;
      if($v.currentTime>lastCur+0.05){lastCur=$v.currentTime;kick(8000);return}
      reloadLive("Stall");
    },ms||8000);
  }

  /* ---- load ---- */
  function fail(e,fatal){
    if(Date.now()-lastFail<400) return;
    lastFail=Date.now();
    var msg=describe(e);
    lastErr=msg;
    if(fatal){ errMsg(msg+" · Stopping"); return; }
    attempts++;
    if(attempts>MAXTRIES){ errMsg(msg+" · Gave up after "+MAXTRIES+" attempts"); return; }
    var wait=Math.min(15000,Math.round(900*Math.pow(1.8,attempts)));
    errMsg(msg+" · Retry "+attempts+"/"+MAXTRIES+" in "+Math.round(wait/1000)+"s");
    setTimeout(function(){ if(busy)return; doLoad(null); },wait);
  }

  async function doLoad(resumeAt){
    if(busy) return;
    busy=true;
    var myGen=++gen;
    clearStall();
    toast(attempts?("Reconnecting · Attempt "+attempts+" Of "+MAXTRIES):"Loading Stream · Please Wait","warn",0);
    try{
      var d=await loadData();
      if(myGen!==gen) return;
      var f=d.channels.find(function(c){return c.id===id});
      if(!f) throw new Error("Channel not in data");
      cookie=f.cookie||""; raw=rawCookie(cookie); url=f.stream_url; keys=buildKeys(f);
      if(!ne(url)) throw new Error("No stream URL");
      if(!Object.keys(keys).length) throw new Error("No DRM keys in data");
      if(f.name) document.title=f.name;
      player.configure(cfg());
      await player.load(withCookie(url,raw), resumeAt);
      if(myGen!==gen) return;
      busy=false;
      started=true;
      lastCur=$v.currentTime;
      kick(9000);
      try{ await $v.play(); }catch(_){}
    }catch(e){
      busy=false;
      if(myGen!==gen) return;
      fail(e,false);
    }
  }

  function reloadLive(tag){
    if(busy) return;
    var at=remember();
    if(at!==null) at=clampTo(at);
    if(tag) lastErr=tag;
    doLoad(at);
  }

  /* ---- events ---- */
  function unmute(){$v.muted=false}
  ["pointerdown","click","keydown"].forEa
